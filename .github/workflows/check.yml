name: Alfred offline checks

on:
  push:
    branches: [main, feat/jetson-voice-agent]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional offline PDF and QR dependencies
        run: python -m pip install "reportlab>=4" "qrcode[pil]>=7.4"
      - name: Check Python syntax
        run: python -m compileall -q alfred tests
      - name: Unit tests (native Cactus engine not required)
        run: python -m unittest discover -s tests -v
