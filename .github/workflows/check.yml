name: Alfred offline checks

on:
  push:
    branches: [main, feat/jetson-voice-agent]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q alfred tests
      - name: Unit tests (native Cactus engine not required)
        run: python -m unittest discover -s tests -v
