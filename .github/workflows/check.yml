name: Alfred offline checks

on:
  push:
    branches: [main, feat/jetson-voice-agent]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q alfred tests
      - name: Unit tests (native Cactus engine not required)
        run: python -m unittest discover -s tests -v
      - name: Needle fast-path P50/P95 (mock inference, paired baseline)
        run: PYTHONPATH=. python tests/bench_needle_fastpath.py
      - name: Scoped context overhead P50/P95 (mock inference, paired baseline)
        run: PYTHONPATH=. python tests/bench_context_fastpath.py

  harness-sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download pinned SDK and Linux x64/ARM64 runtime wheels
        run: |
          mkdir -p /tmp/alfred-harness-wheels
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            -d /tmp/alfred-harness-wheels deepseek-harness-sdk==0.1.5rc1
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            -d /tmp/alfred-harness-wheels deepseek-harness-runtime-bin==0.1.5rc1
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            --platform manylinux_2_28_aarch64 --python-version 3.12 --implementation py \
            --abi none -d /tmp/alfred-harness-wheels deepseek-harness-runtime-bin==0.1.5rc1
      - name: Verify publisher SHA-256 (SDK, Linux x64 and ARM64)
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          lock=json.loads(pathlib.Path("coordination/deepseek-harness-lock.json").read_text())
          for entry in (lock["sdk"],lock["runtime"]["linux_x86_64"],lock["runtime"]["linux_aarch64"]):
              p=pathlib.Path("/tmp/alfred-harness-wheels")/entry["filename"]
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual==entry["sha256"], f"SHA256 mismatch for {p.name}"
              print("Verified",p.name,actual)
          PY
      - name: Install verified pinned SDK/runtime without unsafe profile
        run: |
          python -m pip install --disable-pip-version-check "pydantic>=2.12,<3"
          python -m pip install --no-deps /tmp/alfred-harness-wheels/deepseek_harness_runtime_bin-0.1.5rc1-py3-none-manylinux_2_28_x86_64.whl
          python -m pip install --no-deps /tmp/alfred-harness-wheels/deepseek_harness_sdk-0.1.5rc1-py3-none-any.whl
      - name: Verify Alfred wheel carries safe Cordis overlay
        run: |
          python -m pip wheel --no-deps -w /tmp/alfred-harness-wheels .
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels=list(Path("/tmp/alfred-harness-wheels").glob("alfred_jetson-*.whl"))
          assert len(wheels)==1, wheels
          with zipfile.ZipFile(wheels[0]) as z:
              assert "alfred/cognitive/alfred_safe.patch.yml" in z.namelist(), (
                  "Wheel missing mandatory security overlay")
          print("Installed-wheel Cordis overlay presence verified")
          PY
      - name: Genuine SDK Cordis runtime and local stub-model smoke
        env:
          PYTHONPATH: .
        run: python tests/sdk_smoke.py -v

  review-base-to-head:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact PR base-to-head patch for independent security review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p review
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --binary "$BASE_SHA" "$HEAD_SHA" > review/full-base-to-head.diff
          git diff --stat "$BASE_SHA" "$HEAD_SHA" > review/summary.txt
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > review/paths.txt
          { echo "base=$BASE_SHA"; echo "head=$HEAD_SHA"; } > review/revisions.txt
          (cd review && sha256sum full-base-to-head.diff > SHA256SUMS)
          test -s review/full-base-to-head.diff
          cat review/summary.txt
          cat review/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: review-base-to-head-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: review/
          if-no-files-found: error
          retention-days: 30
