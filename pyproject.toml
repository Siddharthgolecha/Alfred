[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred-jetson"
version = "0.1.0"
description = "Offline-first Jetson voice agent using Whistle, Needle 3 and Qwen 3.5"
requires-python = ">=3.10"
dependencies = [
    "cactus-needle>=0.1",
    "pydantic>=2.12,<3",
    "deepseek-harness-sdk==0.1.5rc1",
    "deepseek-harness-runtime-bin==0.1.5rc1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
wakeword = ["openwakeword>=0.6", "numpy>=1.24"]
jetson = ["reportlab>=4.0", "qrcode[pil]>=7.4", "tzdata>=2024.1"]
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024.8",
    "sphinxcontrib-mermaid>=1.0",
]

[project.scripts]
alfred = "alfred.app:main"
alfred-jetson = "alfred.jetson.cli:main"

[tool.setuptools.packages.find]
include = ["alfred*"]

[tool.setuptools.package-data]
"alfred.cognitive" = ["*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
