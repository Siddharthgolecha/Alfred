[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred-jetson"
version = "0.1.0"
description = "Offline-first voice agent using Whistle, Needle 3 and Qwen 3.5 (Linux/macOS)"
requires-python = ">=3.10"
dependencies = [
    "cactus-needle>=0.1",
    "pydantic>=2.12,<3",
    "deepseek-harness-sdk==0.1.5rc1",
    "deepseek-harness-runtime-bin==0.1.5rc1",
    "rich>=13,<15",
]

[project.optional-dependencies]
test = ["pytest>=8"]
wakeword = ["openwakeword>=0.6", "numpy>=1.24"]
# macOS audio: install sox via Homebrew (`brew install sox`) or ffmpeg (`brew install ffmpeg`).
# Linux audio: install pulseaudio-utils for pactl/parec (`apt install pulseaudio-utils`).
# macOS TTS: built-in `say` command is used automatically; no extra package needed.
# Linux TTS: install speech-dispatcher (`apt install speech-dispatcher`).
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024.8",
    "sphinxcontrib-mermaid>=1.0",
]

[project.scripts]
alfred = "alfred.app:main"

[tool.setuptools.packages.find]
include = ["alfred*"]

[tool.setuptools.package-data]
"alfred.cognitive" = ["*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# openwakeword declares a Linux TFLite dependency even when used in ONNX mode.
# Alfred uses only inference_framework="onnx"; tflite-runtime has no CPython 3.12+
# wheels. This is a uv project-resolution exclusion (not a pip setting).
exclude-dependencies = ["tflite-runtime"]
